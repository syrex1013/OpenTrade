<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">OpenTrade engine loop</title>
  <desc id="desc">Four-stage pipeline from market data through signals and the fee-edge gate to execution, with an expectancy halt feeding back into the gate.</desc>

  <rect width="1200" height="340" fill="#ffffff"/>

  <text x="56" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#ff0000">ENGINE LOOP</text>

  <!-- stage boxes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- 01 DATA -->
    <rect x="56" y="64" width="235" height="150" fill="#f8f9fa" stroke="#dee2e6"/>
    <text x="80" y="92" font-size="13" font-weight="700" fill="#ff0000">01</text>
    <text x="80" y="120" font-size="20" font-weight="700" fill="#212529">MARKET DATA</text>
    <text x="80" y="146" font-size="16" fill="#495057">Binance · KuCoin</text>
    <text x="80" y="168" font-size="16" fill="#495057">· MEXC 1s → 15s/30s</text>
    <text x="80" y="190" font-size="16" fill="#495057">book · spread · skew</text>

    <!-- 02 SIGNALS -->
    <rect x="331" y="64" width="235" height="150" fill="#f8f9fa" stroke="#dee2e6"/>
    <text x="355" y="92" font-size="13" font-weight="700" fill="#ff0000">02</text>
    <text x="355" y="120" font-size="20" font-weight="700" fill="#212529">SIGNALS</text>
    <text x="355" y="146" font-size="16" fill="#495057">EMA · VWAP · RSI(4)</text>
    <text x="355" y="168" font-size="16" fill="#495057">ATR · BB · imbalance</text>
    <text x="355" y="190" font-size="16" fill="#495057">NVIDIA NIM AI scan</text>

    <!-- 03 GATE -->
    <rect x="606" y="64" width="235" height="150" fill="#f8f9fa" stroke="#dee2e6"/>
    <text x="630" y="92" font-size="13" font-weight="700" fill="#ff0000">03</text>
    <text x="630" y="120" font-size="20" font-weight="700" fill="#212529">FEE-EDGE GATE</text>
    <text x="630" y="146" font-size="16" fill="#495057">1-ATR move clears</text>
    <text x="630" y="168" font-size="16" fill="#495057">fee_edge × friction</text>
    <text x="630" y="190" font-size="16" fill="#495057">asymmetric R:R</text>

    <!-- 04 EXECUTE -->
    <rect x="881" y="64" width="235" height="150" fill="#f8f9fa" stroke="#dee2e6"/>
    <text x="905" y="92" font-size="13" font-weight="700" fill="#ff0000">04</text>
    <text x="905" y="120" font-size="20" font-weight="700" fill="#212529">EXECUTE</text>
    <text x="905" y="146" font-size="16" fill="#495057">paper slots (multi)</text>
    <text x="905" y="168" font-size="16" fill="#495057">LIVE: HMAC USDT-M</text>
    <text x="905" y="190" font-size="16" fill="#495057">GTX post-only</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#ff0000" stroke-width="2" fill="#ff0000">
    <line x1="291" y1="139" x2="318" y2="139"/>
    <polygon points="323,139 315,133 315,145"/>
    <line x1="566" y1="139" x2="593" y2="139"/>
    <polygon points="598,139 590,133 590,145"/>
    <line x1="841" y1="139" x2="868" y2="139"/>
    <polygon points="873,139 865,133 865,145"/>
  </g>

  <!-- expectancy halt band -->
  <rect x="56" y="258" width="1060" height="66" fill="#f8d7da" stroke="#ff0000" stroke-width="1.5"/>
  <text x="80" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#ff0000">EXPECTANCY HALT</text>
  <text x="80" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#212529">negative rolling average pauses entries · lifts automatically after halt_cooldown_sec</text>

  <!-- feedback arrow up to gate -->
  <line x1="723" y1="258" x2="723" y2="220" stroke="#ff0000" stroke-width="2"/>
  <polygon points="723,214 718,224 728,224" fill="#ff0000"/>
</svg>
